<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nueva contraseña · Párchate</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0e0b1a;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:20px}
.c{max-width:400px;width:100%}
h1{margin:0 0 8px;font-size:30px;color:#ec4899}
p{color:#e4dcff;line-height:1.5;font-size:16px;margin:8px 0 16px}
.f{position:relative;margin-bottom:12px}
input{width:100%;padding:15px 48px 15px 15px;border-radius:14px;border:1px solid #6d28d9;background:#201838;color:#fff;font-size:17px}
input:focus{outline:none;border-color:#ec4899}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;font-size:20px;cursor:pointer;color:#c4b5fd;padding:6px}
button.go{width:100%;padding:15px;border:0;border-radius:14px;background:#ec4899;color:#fff;font-size:17px;font-weight:700;cursor:pointer}
button.go:disabled{opacity:.6}
#msg{margin-top:12px;font-size:15px;min-height:20px;color:#fca5a5}
.ok{text-align:center;background:#1a1330;border:1px solid #3b2a6b;border-radius:24px;padding:28px 22px}
.ok .t{font-size:54px}
a.b{display:block;margin-top:18px;padding:14px;border-radius:14px;background:linear-gradient(90deg,#db2777,#9333ea);color:#fff;font-weight:700;text-decoration:none}
small{display:block;margin-top:14px;color:#9d90c9;font-size:13px}
.hide{display:none}
</style>
</head>
<body>
<div class="c">
 <div id="form">
  <h1>Crea tu nueva contraseña</h1>
  <p id="sub">Escribe tu nueva contraseña (mínimo 6 caracteres).</p>
  <div class="f"><input id="p1" type="password" autocomplete="new-password" placeholder="Nueva contraseña"><button class="eye" type="button" data-t="p1" aria-label="Mostrar">👁</button></div>
  <div class="f"><input id="p2" type="password" autocomplete="new-password" placeholder="Repite la contraseña"><button class="eye" type="button" data-t="p2" aria-label="Mostrar">👁</button></div>
  <button class="go" id="save" type="button">Guardar contraseña</button>
  <div id="msg"></div>
 </div>
 <div id="done" class="ok hide">
  <div class="t">✅</div>
  <h1 style="font-size:24px;margin-top:6px">¡Listo, tu contraseña quedó guardada!</h1>
  <p>Ya puedes volver a Párchate e iniciar sesión con tu correo y tu nueva contraseña.</p>
  <a class="b" href="com.veltrix.parchate://login-callback">Abrir la app</a>
  <small>Si estás en un computador, abre Párchate en tu celular.</small>
 </div>
</div>
<script>
const SB_URL='https://ofqdizboaexkjjhwtmgs.supabase.co',SB_KEY='sb_publishable_pfLexW8EDmF9-_SRjaiKWQ_y16Yar5f';
const $=id=>document.getElementById(id),msg=t=>{$('msg').textContent=t||''};
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{flowType:'implicit',detectSessionInUrl:true,persistSession:true}});
let ready=false;
sb.auth.onAuthStateChange((ev,s)=>{if(ev==='PASSWORD_RECOVERY'||(ev==='SIGNED_IN'&&s))ready=true});
(async()=>{
 const q=new URLSearchParams(location.search),code=q.get('code');
 if(code){try{await sb.auth.exchangeCodeForSession(code)}catch(e){}}
 setTimeout(async()=>{const {data}=await sb.auth.getSession();if(data&&data.session)ready=true;
  if(!ready){const h=location.hash+location.search;
   msg(/expired|otp_expired|invalid/i.test(h)?'Este enlace ya venció o ya se usó. Vuelve a Párchate y pide uno nuevo en «¿Olvidaste tu contraseña?».':'Abre esta página desde el enlace del correo. Si no funciona, pide uno nuevo en «¿Olvidaste tu contraseña?».')}},1200);
})();
document.addEventListener('click',e=>{const b=e.target.closest('.eye');if(b){const i=$(b.dataset.t);i.type=i.type==='password'?'text':'password'}});
const err=m=>{m=String(m||'');
 if(/same.password|different from the old/i.test(m))return 'Esa es tu contraseña actual. Escribe una diferente.';
 if(/at least|weak|short/i.test(m))return 'La contraseña debe tener mínimo 6 caracteres.';
 if(/session|missing|expired|jwt/i.test(m))return 'El enlace ya venció. Vuelve a Párchate y pide uno nuevo en «¿Olvidaste tu contraseña?».';
 if(/rate|seconds/i.test(m))return 'Por seguridad, espera un minuto e inténtalo de nuevo.';
 return 'No se pudo guardar. Pide un enlace nuevo e inténtalo otra vez.'};
$('save').addEventListener('click',async()=>{
 msg('');const a=$('p1').value,b=$('p2').value;
 if(a.length<6)return msg('La contraseña debe tener mínimo 6 caracteres.');
 if(a!==b)return msg('Las dos contraseñas no coinciden.');
 $('save').disabled=true;$('save').textContent='Guardando…';
 const {error}=await sb.auth.updateUser({password:a});
 if(error){$('save').disabled=false;$('save').textContent='Guardar contraseña';return msg(err(error.message))}
 $('p1').value='';$('p2').value='';
 try{await sb.auth.signOut({scope:'local'})}catch(e){}
 $('form').classList.add('hide');$('done').classList.remove('hide');
});
</script>
</body>
</html>
